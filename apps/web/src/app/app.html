@if (authService.isLoggedIn()) {
  <header class="topbar">
    <strong>MediTrack</strong>
    <nav class="navbar">
      <a routerLink="/patients" routerLinkActive="active">Patients</a>
      <a routerLink="/appointments" routerLinkActive="active">Appointments</a>
    </nav>
    <span>{{ authService.user()?.fullName }}</span>
    <button type="button" (click)="authService.logout()">Sign Out</button>
  </header>
}
<main class="container">
  <router-outlet/>
</main>
