<h1>Create account</h1>
<form [formGroup]="regForm" (ngSubmit)="submit()">
    <label>Full name <input formControlName="fullName" autocomplete="name" /></label>
    <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
    <label>Password <input type="password" formControlName="password" autocomplete="new-password" /></label>
    @if (regForm.controls.password.touched && regForm.controls.password.invalid) {
    <p class="error">Use at least 10 characters.</p>
    }
    <label>Confirm password <input type="password" formControlName="confirm" autocomplete="new-password" /></label>
    @if (regForm.controls.confirm.touched && regForm.hasError('mismatch')) {
    <p class="error">Passwords don't match.</p>
    }
    @if (error()) { <p class="error">{{ error() }}</p> }
    
    <div class="mt-2">
        <button class="btn btn-primary" type="submit" [disabled]="regForm.invalid || busy()">Create account</button>
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
</form>
